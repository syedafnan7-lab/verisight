<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><circle cx='12' cy='11' r='3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <style>
      html, body, #root { width: 100%; min-width: 320px; height: 100%; min-height: 100%; margin: 0; background: #070b14; color: #f1f5f9; }
      .boot-fallback { box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 14px/1.5 system-ui, sans-serif; }
      .boot-card { max-width: 480px; padding: 28px; border: 1px solid #1e293b; border-radius: 16px; background: #0b1120; }
      .boot-card h1 { margin: 0 0 8px; font-size: 18px; }
      .boot-card p { margin: 0; color: #94a3b8; }
      .boot-card button { margin-top: 18px; padding: 9px 14px; border: 0; border-radius: 8px; background: #0284c7; color: white; cursor: pointer; font: inherit; }
      #boot-error { display: none; }
    </style>
    <title>VeriSight — Digital Screenshot Forensics & Authenticity Workbench</title>
  </head>
  <body class="bg-[#070b14] text-[#f1f5f9] antialiased overflow-hidden select-none font-sans">
    <div id="root">
      <main id="boot-fallback" class="boot-fallback" role="status" aria-live="polite">
        <section class="boot-card">
          <h1>Starting VeriSight…</h1>
          <p id="boot-message">Loading the forensic workbench.</p>
          <div id="boot-error">
            <p>VeriSight could not start. Check your connection, then reload the page.</p>
            <button type="button" onclick="window.location.reload()">Reload VeriSight</button>
          </div>
        </section>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        var fallback = document.getElementById('boot-fallback');
        if (!fallback) return;
        var heading = fallback.querySelector('h1');
        var message = document.getElementById('boot-message');
        var error = document.getElementById('boot-error');
        if (heading) heading.textContent = 'VeriSight is taking longer than expected';
        if (message) message.hidden = true;
        if (error) error.style.display = 'block';
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
